<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>날씨</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="common.css">
<style>
  .now { display: flex; align-items: center; gap: 16px; }
  .icon { font-size: 44px; line-height: 1; }
  .temp { font-size: 56px; font-weight: 300; letter-spacing: -1px; line-height: 1; }
  .sub { font-size: 13px; margin-top: 8px; }
  .sub + .sub { margin-top: 4px; }
</style>
</head>
<body>
<div class="card" id="card"><div class="sub" id="msg">날씨 불러오는 중…</div></div>
<script>
  // ?lat=..&lon=..&name=.. 로 위치 변경 가능 (기본: 충북 청주 오창)
  var q = new URLSearchParams(location.search);
  var LAT = q.get('lat') || '36.7167', LON = q.get('lon') || '127.4333', NAME = q.get('name') || '청주 오창';
  var WMO = {
    0: ['☀️', '맑음'], 1: ['🌤️', '대체로 맑음'], 2: ['⛅', '구름 조금'], 3: ['☁️', '흐림'],
    45: ['🌫️', '안개'], 48: ['🌫️', '안개'],
    51: ['🌦️', '약한 이슬비'], 53: ['🌦️', '이슬비'], 55: ['🌧️', '강한 이슬비'],
    61: ['🌧️', '약한 비'], 63: ['🌧️', '비'], 65: ['🌧️', '강한 비'], 66: ['🌧️', '어는 비'], 67: ['🌧️', '어는 비'],
    71: ['🌨️', '약한 눈'], 73: ['🌨️', '눈'], 75: ['❄️', '많은 눈'], 77: ['🌨️', '싸락눈'],
    80: ['🌦️', '소나기'], 81: ['🌧️', '소나기'], 82: ['⛈️', '강한 소나기'], 85: ['🌨️', '눈 소나기'], 86: ['❄️', '강한 눈 소나기'],
    95: ['⛈️', '뇌우'], 96: ['⛈️', '우박 뇌우'], 99: ['⛈️', '우박 뇌우']
  };
  var DAYS = ['일', '월', '화', '수', '목', '금', '토'];
  function w(c) { return WMO[c] || ['🌡️', '-']; }
  function r(x) { return Math.round(x); }
  function load() {
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
      '&current=temperature_2m,weather_code' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min' +
      '&timezone=Asia%2FSeoul&forecast_days=4';
    fetch(url).then(function (res) { return res.json(); }).then(function (d) {
      var c = d.current, dl = d.daily, cw = w(c.weather_code), fc = [];
      for (var i = 1; i < dl.time.length; i++) {
        var day = i === 1 ? '내일' : DAYS[new Date(dl.time[i] + 'T00:00:00').getDay()];
        fc.push(day + ' ' + w(dl.weather_code[i])[0] + ' ' + r(dl.temperature_2m_max[i]) + '°/' + r(dl.temperature_2m_min[i]) + '°');
      }
      document.getElementById('card').innerHTML =
        '<div class="now"><div class="icon">' + cw[0] + '</div><div class="temp">' + r(c.temperature_2m) + '°</div></div>' +
        '<div class="sub">' + NAME + ' · ' + cw[1] + ' · 최고 ' + r(dl.temperature_2m_max[0]) + '° / 최저 ' + r(dl.temperature_2m_min[0]) + '°</div>' +
        '<div class="sub">' + fc.join(' · ') + '</div>';
    }).catch(function () {
      document.getElementById('msg').textContent = '날씨 정보를 불러오지 못했습니다.';
    });
  }
  load(); setInterval(load, 30 * 60 * 1000);
</script>
</body>
</html>
