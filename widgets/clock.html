<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시계</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="common.css">
<style>
  .time { font-size: clamp(40px, 16vw, 64px); font-weight: 300; letter-spacing: -2px; line-height: 1; font-variant-numeric: tabular-nums; }
  .sub { margin-top: 10px; }
</style>
</head>
<body>
<div class="card">
  <div class="time" id="time">--:--</div>
  <div class="sub" id="date"></div>
</div>
<script>
  var DAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
  function kst() { var n = new Date(); return new Date(n.getTime() + (n.getTimezoneOffset() + 540) * 60000); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function tick() {
    var d = kst();
    document.getElementById('time').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    document.getElementById('date').textContent =
      d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + DAYS[d.getDay()];
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
